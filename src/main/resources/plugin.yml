name: DayRooms
version: '1.0.0'
main: com.dayrooms.DayRooms
api-version: '1.20'
author: Bughatti
description: Plugin de salas privadas de practica para servidores BoxPvP

commands:
  dayrooms:
    description: Comando principal del plugin DayRooms
    usage: /dayrooms [create|editor|save|wand|barrier|teleport|effect|keepinventory|utilities|commands|pvp|blocktype|reload|help]
    aliases: [dr, drooms, rooms]
    permission: dayrooms.use
    permission-message: 'No tenes permiso para usar este comando.'

permissions:
  dayrooms.use:
    description: Permite usar /dayrooms
    default: true
  dayrooms.admin:
    description: Permite crear/editar/eliminar rooms y usar reload
    default: op
